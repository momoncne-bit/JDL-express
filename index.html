<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>京東快遞服務申請表</title>
    
    <style>
        :root {
            --bg-primary: #fdfcfb;
            --bg-secondary: #ffffff;
            --accent-red: #c00000;
            --accent-green: #10b981;
            --accent-coral: #e63946;
            --text-primary: #1f2937;
            --text-secondary: #6b7280;
            --border-light: #e5e7eb;
            --border-focus: #c00000;
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            /* 統一選項字體大小 */
            --option-font-size: 0.875rem; 
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            min-height: 100vh;
            padding: 2rem 1rem 6rem 1rem;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            animation: fadeInUp 0.8s ease-out;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .header {
            text-align: center;
            margin-bottom: 3rem;
            position: relative;
        }

        .header h1 {
            font-size: 2.8rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--accent-red) 0%, var(--accent-coral) 50%, #990000 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 0.5rem;
        }

        .header p {
            font-size: 1.1rem;
            color: var(--text-secondary);
        }

        .form-container {
            background: var(--bg-secondary);
            border-radius: var(--radius-lg);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.08);
            overflow: hidden;
            border: 1px solid var(--border-light);
        }

        .form-section {
            padding: 2rem;
            border-bottom: 1px solid var(--border-light);
        }

        .form-section:last-child {
            border-bottom: none;
        }

        .section-title {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .section-icon {
            width: 24px;
            height: 24px;
            background: var(--accent-red);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 0.85rem;
            font-weight: 600;
        }

        /* 統一選擇區塊外框 */
        .delivery-options {
            display: flex;
            gap: 1rem;
            flex-wrap: nowrap;
            background: #f9fafb;
            padding: 0.85rem 1rem;
            border-radius: var(--radius-md);
            border: 1px solid var(--border-light);
            align-items: center;
        }

        .payment-label {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            cursor: pointer;
            font-size: var(--option-font-size);
            font-weight: 600;
            white-space: nowrap;
        }

        .payment-label input[type="radio"] {
            width: 18px;
            height: 18px;
            accent-color: var(--accent-red);
            cursor: pointer;
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1.5rem;
        }

        .product-card {
            border: 2px solid var(--border-light);
            border-radius: var(--radius-md);
            padding: 1.5rem;
            transition: all 0.3s ease;
            cursor: pointer;
            position: relative;
            background: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .product-card:hover {
            border-color: var(--border-focus);
            transform: translateY(-4px);
            box-shadow: 0 12px 24px -8px rgba(192, 0, 0, 0.15);
        }

        .product-card.selected {
            border-color: var(--accent-red);
            background: rgba(192, 0, 0, 0.02);
        }

        .product-header {
            display: flex;
            align-items: flex-start;
            gap: 0.75rem;
            margin-bottom: 0.5rem;
        }

        .product-checkbox {
            width: 22px;
            height: 22px;
            border: 2px solid var(--border-light);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            margin-top: 2px;
            background: var(--bg-secondary);
        }

        .product-checkbox.checked {
            background: var(--accent-red);
            border-color: var(--accent-red);
            color: white;
            font-weight: bold;
            font-size: 0.85rem;
        }

        .product-info h3 {
            font-size: 1.1rem;
            font-weight: 700;
        }

        .product-price-container {
            margin-top: 0.25rem;
            display: flex;
            align-items: baseline;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .product-price {
            font-family: monospace;
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--accent-green);
        }

        .price-error {
            font-size: 0.95rem;
            font-weight: 700;
            color: #ef4444;
        }
        
        .price-note {
            font-size: 0.75rem;
            color: var(--text-secondary);
            display: block;
            margin-bottom: 0.5rem;
        }

        .product-description {
            color: var(--text-secondary);
            font-size: 0.85rem;
            margin-bottom: 1rem;
            min-height: 2.5em;
        }

        /* 重量選擇區塊 */
        .quantity-controls {
            display: flex;
            align-items: center;
            justify-content: space-between;
            opacity: 0.6;
            pointer-events: none;
            transition: all 0.3s ease;
            border: 2px dashed var(--border-light);
            border-radius: var(--radius-md);
            padding: 0.75rem 1rem;
            background: #f8fafc;
            margin-top: 0.5rem;
        }

        .product-card.selected .quantity-controls {
            opacity: 1;
            pointer-events: auto;
            background: #fef2f2;
            border: 2px solid var(--accent-red);
            box-shadow: 0 4px 12px rgba(192, 0, 0, 0.12);
        }

        .quantity-label {
            font-size: 1rem;
            font-weight: 700;
            color: var(--text-primary);
        }

        .quantity-input-wrapper {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .quantity-input {
            width: 105px;
            padding: 0.5rem 0.4rem;
            border: 2px solid var(--border-light);
            border-radius: var(--radius-sm);
            text-align: center;
            font-size: 1.35rem;
            font-weight: 800;
            color: var(--accent-red);
            background: #ffffff;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.04);
            transition: all 0.2s ease;
        }

        .quantity-input:focus {
            outline: none;
            border-color: var(--accent-red);
            box-shadow: 0 0 0 3px rgba(192, 0, 0, 0.25);
        }

        .unit-badge {
            font-size: 1.05rem;
            font-weight: 800;
            color: var(--accent-red);
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        .form-label {
            display: block;
            font-weight: 600;
            margin-bottom: 0.4rem;
        }

        .form-input {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid var(--border-light);
            border-radius: var(--radius-sm);
            font-size: 0.95rem;
            font-family: inherit;
        }

        textarea.form-input {
            resize: vertical;
            line-height: 1.5;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        .payment-options {
            display: flex;
            gap: 2rem;
            margin-top: 0.5rem;
        }

        .submit-btn {
            width: 100%;
            padding: 1rem;
            background: linear-gradient(135deg, #25D366, #128C7E);
            color: white;
            border: none;
            border-radius: var(--radius-md);
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(37, 211, 102, 0.4);
        }

        /* 浮動運費摘要面板 */
        .floating-total {
            position: fixed;
            bottom: 1.5rem;
            right: 1.5rem;
            background: rgba(255, 255, 255, 0.98);
            padding: 1rem 1.25rem;
            border-radius: var(--radius-lg);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.15);
            border: 1px solid var(--border-light);
            z-index: 1000;
            backdrop-filter: blur(10px);
            max-width: 420px;
            width: calc(100% - 3rem);
            transition: all 0.3s ease;
        }

        .floating-total-header {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--text-secondary);
            margin-bottom: 0.4rem;
            border-bottom: 1px solid var(--border-light);
            padding-bottom: 0.3rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .order-summary {
            max-height: 150px;
            overflow-y: auto;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.3rem 0;
            font-size: 0.9rem;
        }

        @media (max-width: 768px) {
            :root {
                --option-font-size: 0.78rem;
            }
            .products-grid { grid-template-columns: 1fr; }
            .form-row { grid-template-columns: 1fr; }
            .payment-options { flex-direction: column; gap: 1rem; }
            .floating-total { bottom: 1rem; right: 1rem; left: 1rem; width: auto; }
            
            .delivery-options {
                padding: 0.75rem 0.5rem;
                gap: 0.3rem;
                justify-content: space-between;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>京東快遞</h1>
            <p>智能報價及運單申請表</p>
        </div>

        <form id="orderForm" class="form-container">
            
            <div class="form-section">
                <h2 class="section-title">
                    <span class="section-icon">1</span>
                    選擇派送方法及類別
                </h2>
                
                <div class="form-group">
                    <label class="form-label">選擇服務類別：</label>
                    <div class="delivery-options">
                        <label class="payment-label">
                            <input type="radio" name="serviceType" value="standard" checked> 京東標快 (T+1)
                        </label>
                        <label class="payment-label">
                            <input type="radio" name="serviceType" value="express"> 京東特快 (4小時)
                        </label>
                        <label class="payment-label">
                            <input type="radio" name="serviceType" value="heavy"> 京快重貨 (T+1)
                        </label>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">選擇派送模式：</label>
                    <div class="delivery-options">
                        <label class="payment-label">
                            <input type="radio" name="deliveryMethod" value="d2d" checked> 門到門
                        </label>
                        <label class="payment-label">
                            <input type="radio" name="deliveryMethod" value="d2s"> 門到店 / 店到門
                        </label>
                        <label class="payment-label">
                            <input type="radio" name="deliveryMethod" value="s2s"> 店到店
                        </label>
                    </div>
                </div>
                <small style="color: var(--text-secondary); display: block; margin-top: 10px;">
                    * 註：「京東特快」僅提供門到門服務；「京快重貨」適合大宗貨件。
                </small>
            </div>

            <div class="form-section">
                <h2 class="section-title">
                    <span class="section-icon">2</span>
                    選擇寄件項目與重量 (單選)
                </h2>
                <div class="products-grid" id="productsGrid">
                    </div>
                <small style="color: var(--text-secondary); display: block; margin-top: 12px;">
                    💡 提示：本表顯示為標準官方運費。送出申請後，專員於後台建立運單時可為您申請 **9 折優惠**！
                </small>
            </div>

            <div class="form-section">
                <h2 class="section-title">
                    <span class="section-icon">3</span>
                    寄件人資料 (Sender)
                </h2>
                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label" for="senderName">寄件人名稱</label>
                        <input type="text" id="senderName" class="form-input" required placeholder="請輸入寄件人姓名或公司名">
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="senderPhone">聯絡電話 (最多12位數字)</label>
                        <input type="tel" id="senderPhone" class="form-input" required 
                               placeholder="請輸入聯絡電話 (僅限數字)" 
                               maxlength="12" inputmode="numeric"
                               oninput="this.value = this.value.replace(/[^0-9]/g, '');">
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-label" for="senderAddress">寄件地址</label>
                    <textarea id="senderAddress" class="form-input" rows="3" required placeholder="請輸入完整寄件地址 (例如：區域、街道、大廈及室號)"></textarea>
                </div>
            </div>

            <div class="form-section">
                <h2 class="section-title">
                    <span class="section-icon">4</span>
                    收件人資料 (Recipient)
                </h2>
                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label" for="recipientName">收件人名稱</label>
                        <input type="text" id="recipientName" class="form-input" required placeholder="請輸入收件人姓名或公司名">
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="recipientPhone">聯絡電話 (最多12位數字)</label>
                        <input type="tel" id="recipientPhone" class="form-input" required 
                               placeholder="請輸入聯絡電話 (僅限數字)" 
                               maxlength="12" inputmode="numeric"
                               oninput="this.value = this.value.replace(/[^0-9]/g, '');">
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-label" for="recipientAddress">到貨地址</label>
                    <textarea id="recipientAddress" class="form-input" rows="3" required placeholder="請輸入完整收件地址 (例如：區域、街道、大廈及室號)"></textarea>
                </div>
            </div>

            <div class="form-section">
                <h2 class="section-title">
                    <span class="section-icon">5</span>
                    繳款方法 (Payment Method)
                </h2>
                <div class="form-group">
                    <div class="payment-options">
                        <label class="payment-label">
                            <input type="radio" name="paymentMethod" value="寄件人支付 (寄付)" checked>
                            寄件人支付 (寄付)
                        </label>
                        <label class="payment-label">
                            <input type="radio" name="paymentMethod" value="收件人支付 (到付)">
                            收件人支付 (到付)
                        </label>
                    </div>
                </div>
                <br>
                <button type="submit" class="submit-btn">📲 透過 WhatsApp 發送申請</button>
            </div>
        </form>
    </div>

    <div class="floating-total" id="floatingTotal">
        <div class="floating-total-header">
            <span>📋 運費摘要</span>
            <small style="color:var(--text-secondary); font-weight:normal;">預估標準價</small>
        </div>
        <div class="order-summary" id="orderSummary">
            <div class="summary-row">
                <span>未選擇任何項目</span>
                <span style="font-family:monospace; color:var(--accent-green); font-weight:bold;">$0.00</span>
            </div>
        </div>
    </div>
    <br><br><br><br>
    <script>
        const products = [
            { id: 'doc', name: '文件', description: '適用於各類商業文件、信函寄遞 (0.5kg 以內)。' },
            { id: 'nondoc', name: '文件及非文件 (包裹)', description: '適用於一般包裹、樣品及 20kg 以上大宗重貨。' }
        ];

        let selectedProducts = new Map();

        // 最新運費價格計算引擎
        function calculatePrice(id, weight, serviceType, deliveryMethod) {
            if (serviceType === 'express') {
                deliveryMethod = 'd2d'; 
            }

            // 1. 文件特別規格 (<=0.5kg)
            if (id === 'doc' && weight <= 0.5) {
                if (serviceType === 'heavy') {
                    return { finalPrice: null, error: '京快重貨不設文件項目' };
                }
                if (serviceType === 'express') {
                    return { finalPrice: 33 };
                } else { // standard
                    if (deliveryMethod === 's2s') {
                        return { finalPrice: 14 };
                    }
                    return { finalPrice: 17 }; // d2d / d2s
                }
            }

            // 2. 超過 20kg 大宗重貨邏輯
            if (weight > 20) {
                if (serviceType === 'express') {
                    return { finalPrice: null, error: '京東特快不設 20kg 以上項目' };
                }
                if (serviceType === 'standard') {
                    let extraWeight = Math.ceil(weight - 20);
                    let base = deliveryMethod === 'd2d' ? 258 : (deliveryMethod === 'd2s' ? 253 : 248);
                    return { finalPrice: base + (extraWeight * 13) };
                }
                if (serviceType === 'heavy') {
                    if (weight <= 39) return { finalPrice: 155 };
                    if (weight <= 59) return { finalPrice: 184 };
                    if (weight <= 79) return { finalPrice: 230 };
                    if (weight <= 300) return { finalPrice: 276 };
                    // 300kg 以上
                    let extraWeight = Math.ceil(weight - 300);
                    return { finalPrice: 276 + (extraWeight * 0.7) };
                }
            }

            // 3. 常規 1.0kg - 20.0kg 重量級距計算
            let tier = weight;
            if (weight <= 5) {
                tier = Math.ceil(weight * 2) / 2;
                if (tier < 1.0) tier = 1.0;
            } else if (weight <= 20) {
                tier = Math.ceil(weight);
            }

            const pricingTable = {
                1.0: { standard: { d2d: 27, d2s: 22, s2s: 14 }, express: 33, heavy: 27 },
                1.5: { standard: { d2d: 34, d2s: 29, s2s: 14 }, express: 41, heavy: 34 },
                2.0: { standard: { d2d: 40, d2s: 35, s2s: 14 }, express: 48, heavy: 40 },
                2.5: { standard: { d2d: 47, d2s: 42, s2s: 24 }, express: 56, heavy: 47 },
                3.0: { standard: { d2d: 53, d2s: 48, s2s: 24 }, express: 63, heavy: 53 },
                3.5: { standard: { d2d: 53, d2s: 48, s2s: 24 }, express: 71, heavy: 60 },
                4.0: { standard: { d2d: 53, d2s: 48, s2s: 24 }, express: 78, heavy: 66 },
                4.5: { standard: { d2d: 53, d2s: 48, s2s: 24 }, express: 86, heavy: 73 },
                5.0: { standard: { d2d: 53, d2s: 48, s2s: 34 }, express: 95, heavy: 78 },
                6.0: { standard: { d2d: 62, d2s: 57, s2s: 34 }, express: 109, heavy: 81 },
                7.0: { standard: { d2d: 62, d2s: 57, s2s: 34 }, express: 123, heavy: 81 },
                8.0: { standard: { d2d: 62, d2s: 57, s2s: 34 }, express: 138, heavy: 81 },
                9.0: { standard: { d2d: 62, d2s: 57, s2s: 34 }, express: 152, heavy: 81 },
                10.0: { standard: { d2d: 62, d2s: 57, s2s: 61 }, express: 166, heavy: 81 },
                11.0: { standard: { d2d: 71, d2s: 66, s2s: 61 }, express: 180, heavy: 118 },
                12.0: { standard: { d2d: 71, d2s: 66, s2s: 61 }, express: 195, heavy: 118 },
                13.0: { standard: { d2d: 71, d2s: 66, s2s: 61 }, express: 209, heavy: 118 },
                14.0: { standard: { d2d: 71, d2s: 66, s2s: 61 }, express: 223, heavy: 118 },
                15.0: { standard: { d2d: 71, d2s: 66, s2s: 61 }, express: 252, heavy: 118 },
                16.0: { standard: { d2d: 80, d2s: 75, s2s: 70 }, express: 252, heavy: 127 },
                17.0: { standard: { d2d: 80, d2s: 75, s2s: 70 }, express: 266, heavy: 127 },
                18.0: { standard: { d2d: 80, d2s: 75, s2s: 70 }, express: 281, heavy: 127 },
                19.0: { standard: { d2d: 80, d2s: 75, s2s: 70 }, express: 295, heavy: 127 },
                20.0: { standard: { d2d: 80, d2s: 75, s2s: 70 }, express: 309, heavy: 127 }
            };

            const data = pricingTable[tier];
            if (!data) return { finalPrice: null, error: '無效重量' };

            if (serviceType === 'express') {
                return { finalPrice: data.express };
            } else if (serviceType === 'heavy') {
                return { finalPrice: data.heavy };
            } else {
                return { finalPrice: data.standard[deliveryMethod] };
            }
        }

        function initializeForm() {
            renderProducts();
            setupEventListeners();
            updateAllPrices(); 
        }

        function renderProducts() {
            const grid = document.getElementById('productsGrid');
            grid.innerHTML = '';
            
            products.forEach(product => {
                const productCard = document.createElement('div');
                productCard.className = 'product-card';
                productCard.dataset.productId = product.id;

                const defaultWeight = product.id === 'doc' ? 0.5 : 1.0;

                productCard.innerHTML = `
                    <div>
                        <div class="product-header">
                            <div class="product-checkbox"></div>
                            <div class="product-info">
                                <h3>${product.name}</h3>
                                <div class="product-price-container" id="price-container-${product.id}">
                                    <span class="product-price">$0.00</span>
                                </div>
                                <span class="price-note">此為該重量標準總價</span>
                            </div>
                        </div>
                        <div class="product-description">${product.description}</div>
                    </div>

                    <div class="quantity-controls">
                        <span class="quantity-label">總重量：</span>
                        <div class="quantity-input-wrapper">
                            <input type="number" class="quantity-input" min="0.1" max="1000" step="0.1" value="${defaultWeight}">
                            <span class="unit-badge">KG</span>
                        </div>
                    </div>
                `;
                grid.appendChild(productCard);
            });
        }

        function setupEventListeners() {
            // 服務類別變更
            document.querySelectorAll('input[name="serviceType"]').forEach(radio => {
                radio.addEventListener('change', updateAllPrices);
            });

            // 派送模式變更
            document.querySelectorAll('input[name="deliveryMethod"]').forEach(radio => {
                radio.addEventListener('change', updateAllPrices);
            });

            // 寄件項目卡片點擊
            document.querySelectorAll('.product-card').forEach(card => {
                card.addEventListener('click', (e) => {
                    if (e.target.classList.contains('quantity-input')) return;
                    toggleProductSelection(card.dataset.productId);
                });
            });

            // 重量變更
            document.querySelectorAll('.quantity-input').forEach(input => {
                input.addEventListener('input', () => {
                    updateAllPrices();
                });
            });

            document.getElementById('orderForm').addEventListener('submit', handleFormSubmit);
        }

        function toggleProductSelection(productId) {
            const card = document.querySelector(`.product-card[data-product-id="${productId}"]`);
            const checkbox = card.querySelector('.product-checkbox');
            
            if (selectedProducts.has(productId)) {
                selectedProducts.delete(productId);
                checkbox.classList.remove('checked');
                checkbox.textContent = '';
                card.classList.remove('selected');
            } else {
                selectedProducts.clear();
                document.querySelectorAll('.product-card').forEach(c => {
                    c.classList.remove('selected');
                    const cb = c.querySelector('.product-checkbox');
                    if (cb) {
                        cb.classList.remove('checked');
                        cb.textContent = '';
                    }
                });

                const product = products.find(p => p.id === productId);
                selectedProducts.set(productId, { id: productId, name: product.name });
                checkbox.classList.add('checked');
                checkbox.textContent = '✓';
                card.classList.add('selected');
            }
            updateAllPrices();
        }

        function updateAllPrices() {
            const deliveryMethod = document.querySelector('input[name="deliveryMethod"]:checked').value;
            const serviceType = document.querySelector('input[name="serviceType"]:checked').value;
            
            document.querySelectorAll('.product-card').forEach(card => {
                const productId = card.dataset.productId;
                const weightInput = card.querySelector('.quantity-input');
                let weight = parseFloat(weightInput.value) || 0.1;

                const priceResult = calculatePrice(productId, weight, serviceType, deliveryMethod);
                const priceContainer = card.querySelector('.product-price-container');

                if (priceResult.finalPrice === null) {
                    priceContainer.innerHTML = `<span class="price-error">⚠️ ${priceResult.error}</span>`;
                } else {
                    priceContainer.innerHTML = `<span class="product-price">$${priceResult.finalPrice.toFixed(2)}</span>`;
                }

                if (selectedProducts.has(productId)) {
                    const item = selectedProducts.get(productId);
                    item.serviceType = serviceType;
                    item.quantity = weight;
                    item.activePrice = priceResult.finalPrice;
                    item.error = priceResult.error;
                }
            });
            updateOrderSummary();
        }

        function updateOrderSummary() {
            const summaryContainer = document.getElementById('orderSummary');
            const globalMethodStr = document.querySelector('input[name="deliveryMethod"]:checked').parentNode.textContent.trim();

            if (selectedProducts.size === 0) {
                summaryContainer.innerHTML = `
                    <div class="summary-row">
                        <span>未選擇任何項目</span>
                        <span style="font-family:monospace; color:var(--accent-green); font-weight:bold;">$0.00</span>
                    </div>
                `;
                return;
            }

            let summaryHTML = '';

            selectedProducts.forEach(item => {
                if (item.activePrice === null) {
                    summaryHTML += `
                        <div class="summary-row">
                            <span style="flex:1;"><strong>${item.name}</strong><br><small style="color:#ef4444;">${item.error}</small></span>
                            <span style="color:#ef4444; font-weight:bold;">無法計算</span>
                        </div>
                    `;
                    return;
                }

                let serviceLabel = '京東標快';
                if (item.serviceType === 'express') serviceLabel = '京東特快';
                if (item.serviceType === 'heavy') serviceLabel = '京快重貨';

                const methodStr = item.serviceType === 'express' ? '門到門' : globalMethodStr;

                summaryHTML += `
                    <div class="summary-row">
                        <span style="flex:1;">
                            <strong>${item.name}</strong><br>
                            <small style="color:var(--text-secondary);">
                                ${serviceLabel} | ${methodStr} | 重量: ${item.quantity}kg
                            </small>
                        </span>
                        <span style="font-family:monospace; font-size: 1.1rem; color: var(--accent-green); font-weight: bold; text-align:right;">
                            $${item.activePrice.toFixed(2)}
                        </span>
                    </div>
                `;
            });

            summaryContainer.innerHTML = summaryHTML;
        }

        function handleFormSubmit(e) {
            e.preventDefault();

            if (selectedProducts.size === 0) {
                alert('請至少勾選一個寄件項目！');
                return;
            }

            let total = 0;
            let containsError = false;

            selectedProducts.forEach(item => {
                if (item.activePrice === null) containsError = true;
                else total += item.activePrice;
            });

            if (containsError) {
                alert('選擇的寄件服務與重量有誤，請先更正後再送出！');
                return;
            }

            const globalMethodStr = document.querySelector('input[name="deliveryMethod"]:checked').parentNode.textContent.trim();
            let orderDetails = "📦 *【京東快遞 - 新運單申請】*\n\n";

            orderDetails += "*--- 寄件項目 ---*\n";
            selectedProducts.forEach(item => {
                let serviceLabel = '京東標快';
                if (item.serviceType === 'express') serviceLabel = '京東特快';
                if (item.serviceType === 'heavy') serviceLabel = '京快重貨';

                const methodStr = item.serviceType === 'express' ? '門到門' : globalMethodStr;

                orderDetails += `• 類型: ${item.name}\n`;
                orderDetails += `  服務: ${serviceLabel}\n`;
                orderDetails += `  方式: ${methodStr}\n`;
                orderDetails += `  重量: ${item.quantity}kg\n`;
                orderDetails += `  標準小計: $${item.activePrice.toFixed(2)}\n\n`;
            });
            orderDetails += `*預估標準總金額: $${total.toFixed(2)}*\n`;
            orderDetails += `_(專員建立運單時可為您申請 9 折優惠)_\n\n`;

            const senderName = document.getElementById('senderName').value;
            const senderPhone = document.getElementById('senderPhone').value;
            const senderAddress = document.getElementById('senderAddress').value;

            const recipientName = document.getElementById('recipientName').value;
            const recipientPhone = document.getElementById('recipientPhone').value;
            const recipientAddress = document.getElementById('recipientAddress').value;

            const paymentMethod = document.querySelector('input[name="paymentMethod"]:checked').value;

            orderDetails += "*--- 寄件人資料 ---*\n";
            orderDetails += `👤 名稱: ${senderName}\n`;
            orderDetails += `📞 電話: ${senderPhone}\n`;
            orderDetails += `📍 地址: ${senderAddress}\n\n`;

            orderDetails += "*--- 收件人資料 ---*\n";
            orderDetails += `👤 名稱: ${recipientName}\n`;
            orderDetails += `📞 電話: ${recipientPhone}\n`;
            orderDetails += `📍 地址: ${recipientAddress}\n\n`;

            orderDetails += "*--- 繳款方法 ---*\n";
            orderDetails += `💳 選擇: ${paymentMethod}`;

            const myWhatsAppNumber = "85298884497"; 

            const encodedMessage = encodeURIComponent(orderDetails);
            const whatsappURL = `https://wa.me/${myWhatsAppNumber}?text=${encodedMessage}`;

            window.open(whatsappURL, '_blank');
        }

        document.addEventListener('DOMContentLoaded', initializeForm);
    </script>
</body>
</html>
